name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wealthmgmt
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -B -q
        working-directory: backend

      - name: Run tests with coverage
        run: mvn test -B -Dsurefire.useFile=false
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/index.html ]; then
            echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract coverage from JaCoCo CSV
            if [ -f backend/target/site/jacoco/jacoco.csv ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -1 backend/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
              tail -n +2 backend/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full report available in the **jacoco-report** artifact." >> $GITHUB_STEP_SUMMARY
          fi
